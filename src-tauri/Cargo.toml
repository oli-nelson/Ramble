[package]
name = "ramble"
default-run = "ramble"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A little space to find your words"

[lib]
name = "ramble_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ramble"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "fake-harness"
path = "src/bin/fake_harness.rs"
required-features = ["test-harness"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-clipboard-manager", "dep:accessibility-sys", "dep:core-foundation", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows-sys"]
test-harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = { version = "0.2", optional = true }
core-foundation = { version = "0.10", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSWindow", "objc2-core-foundation"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading"], optional = true }
